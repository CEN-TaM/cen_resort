<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>휴양소 후기 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- 관리자 페이지 (PC 용). 데이터는 /api/admin/... (server/admin.js) — 관리자만 받는다 -->

  <!-- 로그인 (로그인 안 했거나 관리자가 아닐 때) -->
  <div class="gate" id="gate" hidden>
    <form class="gate-box" id="login-form" autocomplete="on">
      <div class="gate-logo">휴양소 후기 <b>관리자</b></div>
      <p class="gate-msg" id="gate-msg">관리자 계정으로 로그인하세요.</p>
      <label>사번<input id="login-empno" inputmode="numeric" autocomplete="username" required></label>
      <label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn primary block">로그인</button>
      <p class="gate-err" id="login-err"></p>
      <a class="gate-link" href="/">앱으로 돌아가기</a>
    </form>
  </div>

  <div class="layout" id="app" hidden>
    <aside class="side">
      <div class="side-logo">휴양소 후기 <b>관리자</b></div>
      <nav class="side-nav">
        <a class="on" data-menu="notices">공지사항</a>
        <a class="soon" title="다음 단계">직원 명단 · 권한</a>
        <a class="soon" title="다음 단계">후기 · 꿀팁</a>
        <a class="soon" title="다음 단계">배지 · 포인트</a>
        <a class="soon" title="다음 단계">휴양소 정보</a>
      </nav>
      <div class="side-foot">
        <div id="me-name"></div>
        <a href="/" target="_blank" rel="noopener">앱 열기 ↗</a>
        <button type="button" class="link" id="logout-btn">로그아웃</button>
      </div>
    </aside>

    <main class="main">
      <!-- 공지사항 목록 -->
      <section id="notice-list-view">
        <header class="page-head">
          <div>
            <h1>공지사항</h1>
            <p class="sub">앱의 공지 탭 · 알림에 나오는 글입니다. 숨긴 공지는 앱에 보이지 않습니다.</p>
          </div>
          <button type="button" class="btn primary" id="new-notice-btn">+ 새 공지</button>
        </header>
        <div class="toolbar">
          <input type="search" id="notice-q" placeholder="제목 · 부서 검색">
          <select id="notice-filter">
            <option value="">전체</option>
            <option value="active">보이는 공지</option>
            <option value="hidden">숨긴 공지</option>
            <option value="pinned">상단 고정</option>
          </select>
          <span class="count" id="notice-count"></span>
        </div>
        <table class="grid">
          <thead>
            <tr><th style="width:56px">고정</th><th style="width:96px">분류</th><th>제목</th><th style="width:120px">작성 부서</th>
              <th style="width:76px">상태</th><th style="width:64px" class="num">조회</th><th style="width:104px">작성일</th><th style="width:190px"></th></tr>
          </thead>
          <tbody id="notice-rows"></tbody>
        </table>
      </section>

      <!-- 공지 쓰기 · 고치기 -->
      <section id="notice-edit-view" hidden>
        <header class="page-head">
          <div>
            <button type="button" class="link back" id="edit-back">← 목록</button>
            <h1 id="edit-title">새 공지</h1>
          </div>
          <div class="head-actions">
            <button type="button" class="btn" id="edit-cancel">취소</button>
            <button type="button" class="btn primary" id="edit-save">저장</button>
          </div>
        </header>
        <div class="editor">
          <form class="form" id="notice-form" onsubmit="return false">
            <div class="row2">
              <label>분류<select id="f-category"></select></label>
              <label>작성 부서<input id="f-author" maxlength="30" placeholder="예: 인사복지팀"></label>
            </div>
            <label>제목<input id="f-title" maxlength="100" placeholder="공지 제목"></label>
            <div class="row2">
              <label class="check"><input type="checkbox" id="f-pinned"> 목록 맨 위에 고정</label>
              <label class="check"><input type="checkbox" id="f-active" checked> 앱에 보이기</label>
            </div>
            <label>작성일 <span class="hint">비워 두면 지금 · 목록 순서와 '며칠 전' 표시에 쓰인다</span>
              <input type="datetime-local" id="f-created"></label>
            <label>본문
              <span class="hint">### 소제목 · - 목록 · &gt; 강조 상자 · **굵게** · 빈 줄 = 문단 나눔 (HTML 은 글자로 보입니다)</span>
              <textarea id="f-body" rows="16" placeholder="본문을 입력하세요"></textarea>
            </label>
            <div class="files">
              <div class="files-head">첨부 <span class="hint">사내에서 열리는 주소(http/https)가 있을 때만 앱에 받기 버튼이 생깁니다</span>
                <button type="button" class="link" id="file-add">+ 첨부 추가</button></div>
              <div id="file-rows"></div>
            </div>
            <p class="form-err" id="form-err"></p>
            <div class="danger-zone" id="danger-zone" hidden>
              <button type="button" class="btn danger" id="edit-delete">이 공지 삭제</button>
              <span class="hint">삭제하면 되돌릴 수 없습니다. 잠깐 내리려면 '앱에 보이기' 를 끄세요.</span>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="admin.js"></script>
</body>
</html>
