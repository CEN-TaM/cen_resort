<!-- DETAIL -->
<div class="screen" data-screen="detail">
  <div class="app-header">
    <img class="back" src="assets/images/ico_back.png" alt="뒤로가기" onclick="goBack('device1','detail')">
    <div class="title">휴양소</div>
    <!-- 즐겨찾기 data-fav 는 tips.js openResort() 가 그 휴양소로 채운다 -->
    <div class="actions"><img class="hd-ico" src="assets/images/ico_share.png" alt="공유하기" onclick="openShareSheet()"><span
        class="fav-btn inline header-style" id="detail-fav" data-fav="" onclick="toggleFavorite(event,this.dataset.fav)"
        aria-label="즐겨찾기"><img class="hd-ico fav-ico-off" src="assets/images/ico_star.png" alt=""><img class="hd-ico fav-ico-on" src="assets/images/ico_star_on.png" alt=""></span></div>
  </div>
  <div class="content">
    <!-- 사진만. 이름·유형은 사진 아래 -->
    <div class="hero" data-img="hero-jocheon" role="img" aria-label="휴양소 사진"></div>
    <div class="place-detail-head">
      <div class="place-name-row">
        <h2 id="detail-resort-name">조천 휴양소</h2>
        <span class="place-type" id="detail-resort-type">정기휴양소</span>
      </div>
    </div>
    <!-- 클래스 훅(.score-main .big-num / .stars / .review-count, .score-breakdown .score-item)은 JS 가 채운다 -->
    <div class="score-board">
      <div class="score-main">
        <div class="big-num">4.8</div>
        <div class="main-meta">
          <span class="stars" aria-hidden="true">★★★★★</span>
          <span class="review-count">· 후기 0</span>
        </div>
      </div>
      <div class="score-breakdown">
        <div class="score-item">
          <i class="ti ti-map-pin"></i>
          <div class="bl">위치</div>
          <div class="bn">4.7</div>
        </div>
        <div class="score-item">
          <i class="ti ti-building-cottage"></i>
          <div class="bl">시설</div>
          <div class="bn">4.9</div>
        </div>
        <div class="score-item">
          <i class="ti ti-sparkles"></i>
          <div class="bl">청결</div>
          <div class="bn">4.8</div>
        </div>
      </div>
    </div>
    <!-- 탭 활성 판정은 data-dtab-target 으로 한다 (detail.js markDetailTab) -->
    <div class="tab-nav">
      <button type="button" class="tnav active" data-dtab-target="tips" onclick="showDetailTab(this,'tips')">휴양소 정보</button>
      <button type="button" class="tnav" data-dtab-target="reviews" onclick="showDetailTab(this,'reviews')">후기 0</button>
    </div>

    <div class="dtab-pane active" data-dtab="tips">

      <!-- 휴양소 정보. 내용은 tips.js renderResortInfo() 가 데이터로 채우고, 데이터가 없는 줄은 숨긴다 -->
      <div class="info-intro" id="detail-intro" hidden>
        <div class="ii-name" id="detail-facility"></div>
        <div class="ii-sum" id="detail-summary"></div>
      </div>
      <ul class="info-list">
        <li class="info-row" id="detail-address-row"><img class="info-ico" src="assets/images/ico_fill_location.png" alt=""><span class="txt" id="detail-address"></span>
          <button type="button" class="info-more" id="detail-nav-btn" hidden onclick="openNavSheet()">길찾기<i class="ti ti-chevron-right"></i></button>
        </li>
        <li class="info-row" id="detail-room-row" hidden><img class="info-ico" src="assets/images/ico_fill_person.png" alt=""><span class="txt" id="detail-room"></span></li>
        <li class="info-row" id="detail-amenities-row" hidden><img class="info-ico" src="assets/images/ico_fill_redeem.png" alt=""><span class="txt" id="detail-amenities"></span>
          <button type="button" class="info-more" onclick="openFeatureModal()">전체보기<i class="ti ti-chevron-right"></i></button>
        </li>
        <li class="info-row" id="detail-all-row" hidden>
          <button type="button" class="info-all" onclick="openFeatureModal()">휴양소 정보 전체보기 (이용 안내 · 주변 관광지)<i class="ti ti-chevron-right"></i></button>
        </li>
      </ul>

      <!-- scrollSwipe() 는 .tip-head 바로 다음 형제 .swipe-row 를 찾는다. 순서 유지 -->
      <div class="tip-head">
        <h3>다녀온 동료들의 꿀팁</h3>
        <div class="tip-nav">
          <button type="button" class="tip-arrow" onclick="scrollSwipe(this,-1)" aria-label="이전 꿀팁"><i
              class="ti ti-chevron-left"></i></button>
          <button type="button" class="tip-arrow" onclick="scrollSwipe(this,1)" aria-label="다음 꿀팁"><i
              class="ti ti-chevron-right"></i></button>
        </div>
      </div>

      <!-- 꿀팁 목록은 tips.js 가 휴양소별로 그린다 -->
      <div class="swipe-row" id="tip-row"></div>
      <div class="tip-write">
        <button type="button" class="tip-write-btn" onclick="openTipModal()">꿀팁 작성하기</button>
        <img class="tip-mascot" src="assets/images/img_btnseni.png" alt="" aria-hidden="true"
          onerror="this.style.display='none'">
      </div>
    </div>

    <div class="detail-gap" aria-hidden="true"></div>

    <!-- 후기 -->
    <div class="dtab-pane" data-dtab="reviews">
      <div class="rev-section-head">
        <div class="rev-title">
          <span>후기</span><em class="rev-count">0</em>
        </div>
        <label class="rev-filter-toggle">
          <input type="checkbox" id="rev-photo-only" onchange="renderReviewList()"> 사진 있는 후기만 <em id="rev-photo-count"></em>
        </label>
      </div>

      <!-- 보던 휴양소를 골라 둔 채 후기 작성 화면을 연다 (review-write.js writeReviewForDetail) -->
      <button type="button" class="rev-write-btn" onclick="writeReviewForDetail()">
        <i class="ti ti-pencil" aria-hidden="true"></i> 후기 작성하기
      </button>

      <!-- 동행 칩: lightbox.js renderReviewFilters() 가 실제 후기로 숫자를 세고, 누르면 그 동행 후기만 남긴다 (여러 개 고르면 하나라도 맞는 후기) -->
      <div class="rev-filter-row" id="rev-companion-row" hidden>
        <span class="rev-filter-label">동행</span>
        <div class="rev-chips" id="rev-companion-chips"></div>
      </div>

      <div class="rev-divider"></div>
      <!-- 후기 카드는 lightbox.js renderReviewList() 가 그린다 (서버 후기 또는 data/reviews-sample.js) -->
      <div id="server-reviews"></div>
    </div>

  </div>
</div>
